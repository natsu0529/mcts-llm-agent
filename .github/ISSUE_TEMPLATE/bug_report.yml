name: Bug report
description: Something doesn't work the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command you ran, plus any relevant config.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: agent-mcts version
      description: Output of `agent-mcts --version`
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Python version and OS
      placeholder: "Python 3.12 / macOS 15"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: Paste the full traceback if there is one. Redact any API keys.
      render: shell
